# unifi-vpn-watchdog configuration. Copy to config.yaml. ${VAR} and ${VAR:-default} are read from the environment.
# The file is hot-reloaded: save it and the watchdog applies it within one cycle (invalid files are rejected).

interval_seconds: 15
state_file: /data/state.json
log: {level: INFO, format: text}      # format: json for log shippers

unifi:
  url: https://192.168.1.1
  api_key: ${UNIFI_API_KEY}
  site: default
  verify_tls: false

detection:
  failure_threshold: 3            # bad polls in a row (x interval_seconds) before a tunnel is declared down
  probe_failure_threshold: 2      # bad exit-IP probes in a row
  probe_interval_seconds: 30
  blackhole: {enabled: true, min_tx_bps: 2000, samples: 6}   # CONNECTED but receiving nothing

probe:
  mode: none                      # none | direct  (see README: "Probe modes")
  require: 1                      # endpoints that must agree
  timeout_seconds: 8
  country_aliases: {GB: [UK]}

switching:
  connect_timeout_seconds: 40
  min_hold_seconds: 60            # hard failures (tunnel not CONNECTED) bypass this
  max_switches_per_hour: 6
  quarantine: {base_seconds: 120, factor: 2, max_seconds: 3600}

failback:
  enabled: true
  check_interval_seconds: 120
  stable_seconds: 300             # preferred tunnel must test healthy this long before switching back


groups:
  - name: iot-and-vpn
    order:                                   # fallback sequence: #1 is used first, then #2, #3 ... (exact tunnel names, any names)
      - Home-Primary
      - Home-Backup
      - {tunnel: Office-Berlin, expect_country: DE}   # expect_country is optional: the exit-IP test must then see that country
      - Last-Resort
    # overrides:                             # any detection/switching/failback key, per group
    #   detection: {failure_threshold: 2}

notifications: []
  # - {type: home_assistant, supervisor: true, service: notify.mobile_app_myphone}   # inside an HA add-on
  # - {type: home_assistant, url: http://192.168.1.50:8123, token: ${HA_TOKEN}, service: notify.notify}
  # - {type: ntfy, url: https://ntfy.sh, topic: my-vpn-alerts}
  # - {type: telegram, token: ${TELEGRAM_BOT_TOKEN}, chat_id: ${TELEGRAM_CHAT_ID}}
  # - {type: webhook, url: https://example.invalid/hook, events: [switch, exhausted, leak]}

mqtt:                            # Home Assistant entities (sensors, pause switch, force-tunnel select)
  enabled: false
  # supervisor: true             # inside an HA add-on: broker credentials come from the Mosquitto add-on
  # host: 192.168.1.50
  # username: ${MQTT_USER}
  # password: ${MQTT_PASSWORD}

server:
  enabled: true
  port: 8080
  control_token: ${WATCHDOG_CONTROL_TOKEN:-}   # empty = control endpoints disabled (read-only status)
