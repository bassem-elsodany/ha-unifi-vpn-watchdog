name: Resolvr
version: "1.1.0-rc.1"
slug: resolvr
description: "Monitoring dashboard for Technitium DNS Server in a Home Assistant sidebar panel: live query traffic, clients, cache, zones, DHCP, blocking and block-list updates."
url: https://github.com/bassem-elsodany/resolvr-dns-dashboard
image: ghcr.io/bassem-elsodany/resolvr
arch: [aarch64, amd64]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8787
panel_icon: mdi:dns
panel_title: Resolvr
watchdog: http://[HOST]:[PORT:8787]/healthz
options:
  technitium_url: "http://homeassistant.local:5380"
  technitium_token: ""
schema:
  technitium_url: url
  technitium_token: password
