name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unifi-vpn-watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: unifi-vpn-watchdog/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the standalone Docker image (no push)
        run: docker build -f unifi-vpn-watchdog/docker/Dockerfile -t unifi-vpn-watchdog:ci unifi-vpn-watchdog
  resolvr:
    name: Resolvr add-on manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: pytest -q resolvr/tests

