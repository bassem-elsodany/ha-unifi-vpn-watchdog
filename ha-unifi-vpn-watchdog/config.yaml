name: HA UniFi VPN Watchdog
version: "0.7.0"
slug: ha_unifi_vpn_watchdog
description: Health-checks UniFi WireGuard VPN clients and fails policy routes over between servers, cities and countries.
url: https://github.com/bassem-elsodany/ha-unifi-vpn-watchdog
arch: [aarch64, amd64]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:vpn
panel_title: VPN Watchdog
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
map:
  - addon_config:rw
options:
  unifi_url: "https://10.0.1.1"
  unifi_api_key: ""
  log_level: INFO
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  unifi_url: str
  unifi_api_key: password
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  control_token: password?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
