# docker compose -f docker/docker-compose.yml up -d
# To build from source instead:  docker build -f docker/Dockerfile -t ha-unifi-vpn-watchdog .   (then set `image:` to ha-unifi-vpn-watchdog and remove pull_policy)
services:
  ha-unifi-vpn-watchdog:
    image: ghcr.io/bassem-elsodany/ha-unifi-vpn-watchdog:latest
    pull_policy: always            # compose never re-checks a cached :latest on its own; this makes `up -d` always look
    container_name: ha-unifi-vpn-watchdog
    restart: unless-stopped
    env_file: ../.env              # UNIFI_API_KEY, WATCHDOG_CONTROL_TOKEN, ...
    volumes:
      - ../config:/config:rw       # config.yaml (the web UI edits it); hot-reloaded
      - ha-unifi-vpn-watchdog-data:/data    # state.json: quarantines and switch history survive restarts
    ports: ["8080:8080"]           # web UI, /metrics, /healthz
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
volumes:
  ha-unifi-vpn-watchdog-data:
