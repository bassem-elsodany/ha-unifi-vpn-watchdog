# Probe agent on a host that needs its OWN MAC (macvlan). The UDM sees it as a separate client, and the watchdog
# points that client's policy route at whichever tunnel it wants to test. Adjust parent/subnet/addresses.
# Use together with probe.mode: remote in config.yaml (remote_url: http://10.0.60.200:8081, canary.mac below).
services:
  vpn-probe-agent:
    image: ha-unifi-vpn-watchdog:latest
    container_name: vpn-probe-agent
    restart: unless-stopped
    command: ["agent", "--port", "8081"]
    env_file: ../.env              # AGENT_TOKEN (optional)
    volumes: ["../config:/config:ro"]
    mac_address: "02:42:0a:00:3c:c8"
    networks:
      canary:
        ipv4_address: 10.0.60.200
networks:
  canary:
    driver: macvlan
    driver_opts: {parent: eth0}    # e.g. eth0.60 for a tagged VLAN 60
    ipam:
      config: [{subnet: 10.0.60.0/24, gateway: 10.0.60.1, ip_range: 10.0.60.200/29}]
