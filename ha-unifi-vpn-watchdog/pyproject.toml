[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-unifi-vpn-watchdog"
version = "0.12.1"
description = "Health-checks UniFi WireGuard VPN clients and fails policy routes over between servers, cities and countries."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ha-unifi-vpn-watchdog = "vpn_watchdog.cli:main"
vpn-watchdog = "vpn_watchdog.cli:main"      # short alias

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vpn_watchdog = ["ui/*.html", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
